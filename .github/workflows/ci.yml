# hackathon-app CI: 테스트 → Docker 빌드 → (main 일 때만) GHCR push
# 출처: Pre-SKALA 해커톤 학습사이트 2.0 「완성된 ci.yml 전문」
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 기본은 읽기만 허용한다. 쓰기가 필요한 job 에서만 늘린다
permissions:
  contents: read

# 같은 브랜치에 새 push 가 오면 앞선 실행을 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v7

      - name: Python 설치
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: 패키지 설치
        run: pip install -r requirements-dev.txt

      - name: 테스트 실행
        run: pytest -v --junitxml=report.xml

      - name: 테스트 결과 보관
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report-${{ matrix.python-version }}
          path: report.xml
          retention-days: 7

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Docker 이미지 빌드
        run: docker build -t hackathon-app:${{ github.sha }} .

      - name: 컨테이너 기동 확인
        run: |
          docker run -d --name app -p 8000:8000 hackathon-app:${{ github.sha }}
          for _ in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs app
          exit 1

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: 태그 만들기
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: GHCR 로그인
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: 빌드하고 push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
